[package]
name = "halma8_ai"
version = "0.1.0"
edition = "2021"

[lib]
name = "halma8_ai"
path = "src/lib.rs"

[[bin]]
name = "ai"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "selfplay"
path = "src/bin/selfplay.rs"

# std-only: no [dependencies] section (kego_engine_v2 matches — zero external deps).

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
